name: CI

on:
  push:
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -e ".[dev,validate]"

      # 出荷物を作る工程を CI でも一度通す。
      # CSV はリポジトリに入っているので取得は起きない。
      # このステップは sha256 の一致を確かめる整合検査として働く。
      - run: python scripts/fetch_geoshape.py
      - run: python scripts/normalize.py
      - run: python scripts/geocode_records.py
      # 地形特徴は派生値を同梱しているので、標高タイルの取得は起きない。
      # 取得と算出(fetch_dem.py / terrain_features.py)はローカル専用。
      - run: python scripts/apply_terrain.py
      - run: python scripts/build_web_assets.py

      # 生成物が無いときの skip を CI では落ちるようにする(skip は緑と見分けが付かない)。
      - run: python -m pytest -q
        env:
          KOFUN_REQUIRE_ARTIFACTS: "1"
      - run: python harness/text_hygiene.py

  loop-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate loop logs
        run: python harness/looplog.py validate
